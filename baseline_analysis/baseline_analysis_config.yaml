# Baseline Analysis Configuration
# Configuration for standalone baseline time reconstruction analysis

model_name: "baseline_analysis_track"

# Data parameters
data_dir: "../../selected_h5_with_jets/"
num_files: 43
max_cells: 40
min_cells: 1
cell_selection_feature: "Cell_e"

# Feature selection parameters
use_spatial_features: false         # Spatial position features
use_track_features: true            # Track matching features (default)
use_jet_features: false             # Jet matching features
use_physics_informed_features: true # Physics-based 1/sigma^2 weighting

# Cell filtering parameters
require_valid_cells: true
use_cell_track_matching: true       # Track-based cell filtering (default)
use_cell_jet_matching: false        # Jet-based cell filtering
additional_cell_filters: {}

# Time quality cut parameters
use_time_quality_cut: true    # Enable time-based quality filtering
vertex_time_sigma: 175.0       # HS vertex time uncertainty [ps]  
time_quality_n_sigma: 3.0      # N-sigma cut threshold

# Baseline method filtering parameters
use_baseline_method_filter: true    # Enable baseline method performance filtering
baseline_method_threshold: 500.0    # Baseline error threshold in ps (±500 ps default)

# Detector calibration parameters
use_detector_params: true
calibration_data_file: "HStrackmatching_calibration.txt"

# Analysis parameters
top_worst_events: 20             # Number of worst events to display in detail
feature_comparison_sample_size: 2000  # Number of events for best/worst comparison plots
gaussian_fit_range: 120         # Range for Gaussian fit in error plots

# Output parameters
output_base_dir: "../../bad_events_check"  # Base directory for analysis outputs
create_timestamp_dir: true       # Create timestamped subdirectory

# Feature definitions for analysis
all_cell_features:
  - "Cell_x"
  - "Cell_y"
  - "Cell_z"
  - "Cell_eta"
  - "Cell_phi"
  - "Cell_Barrel"
  - "Cell_layer"
  - "Cell_time_TOF_corrected"
  - "Cell_e"
  - "Cell_significance"

track_features:
  - "matched_track_pt"
  - "matched_track_deltaR"

jet_features:
  - "matched_jet_pt"
  - "matched_jet_eta"
  - "matched_jet_phi"
  - "matched_jet_width"
  - "matched_jet_deltaR"

# Features to include in distribution comparison plots
comparison_features:
  - "Cell_x"
  - "Cell_y"
  - "Cell_z"
  - "Cell_eta"
  - "Cell_phi"
  - "Cell_Barrel"
  - "Cell_layer"
  - "Cell_time_TOF_corrected"
  - "Cell_e"
  - "Cell_significance"
  - "matched_track_pt"
  - "matched_track_deltaR"

# Plot configuration
plot_x_range: [-2000, 2000]    # Range for time plots in ps
plot_bins: 400                  # Number of bins for histograms