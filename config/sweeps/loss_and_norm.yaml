# beta, head normalization and the event encoder, as an exact grid.
#
#   python scripts/sweep.py --space config/sweeps/loss_and_norm.yaml \
#       --config ../sweeps/v2_base.yaml --out ../sweeps/v2_loss_and_norm
#
# A grid, not a random search. An earlier random search drew 24 points over
# 7 parameters and returned nothing significant -- the strongest trend
# reached only p = 0.07. 4 x 3 x 2 lands on exactly 24 points and measures
# every beta six times and every norm eight, so each marginal effect is
# estimable rather than merely suggested.
#
# Re-run on the fixed input pipeline. The first pass ranked head.norm as
# layer > none > batch, but every batch then held a single sample, so batch
# normalization was computing its statistics on ttbar alone or VBF alone.
# That result says nothing about batch normalization and has to be redone.
#
# Interpreting it: repeated runs of one setting spread by up to 2 ps, so
# nothing closer than that is a finding.

trials: 24
seed: 12
epochs: 300

space:
  loss.beta:           [0.0, 0.25, 0.5, 1.0]
  head.norm:           [none, layer, batch]
  event_encoder.units: [[], [32, 16]]
