# lar_only: trained on the mixture, on ttbar alone and on VBF alone.
#
#   python scripts/sweep.py --space config/sweeps/physics_lar_only.yaml \
#       --config config/blocks/lar_only.yaml --out ../runs/lar_only
#
# Three seeds of each, because two runs of one setting spread by 1-2 ps and a
# single number cannot carry a physics claim. Nothing is being searched here;
# the sweep runner is used for its repeats, its GPU fan-out and its record.
#
# The block config's event_select keeps only events whose sum-pt^2 vertex
# is within 3 mm of the true hard scatter, so the wrong-vertex events that
# used to set the ttbar/VBF gap are gone before training. Results, and the
# numbers from before that cut, are in CLAUDE.md.

trials: 9
seed: 100
epochs: 300
repeats: 3

space:
  data.datasets:
    - - {name: ttbar, path: /global/cfs/cdirs/m2616/liangyu/vertextiming/store/ttbar}
      - {name: vbf_hinv, path: /global/cfs/cdirs/m2616/liangyu/vertextiming/store/vbf_hinv}
    - - {name: ttbar, path: /global/cfs/cdirs/m2616/liangyu/vertextiming/store/ttbar}
    - - {name: vbf_hinv, path: /global/cfs/cdirs/m2616/liangyu/vertextiming/store/vbf_hinv}
