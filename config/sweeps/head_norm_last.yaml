# Drop only the head's last LayerNorm: remove the bound, keep the rest.
#
#   python scripts/sweep.py --space config/sweeps/head_norm_last.yaml \
#       --config config/blocks/lar_hgtd.yaml --out ../runs/head_norm_last/lar_hgtd
#   (and the same for lar_only and hgtd_only)
#
# head_norm.yaml found the bound on the prediction comes from the LayerNorm
# right before the read-out, and that removing every head LayerNorm (none)
# lifts it but costs 1-3 ps. The earlier ones bound nothing -- a Dense layer
# follows each -- so if the cost is theirs, keeping them and dropping only
# the last should lift the bound for free.
#
# Controls on disk: layer is ../runs/<config> trials 000-002, none is
# ../runs/head_norm/<config> trials 000-002.
#
# RESULT (validation q68 in ps, three seeds; test events with |t0| > 400 ps):
#
#              head         val all      ttbar  VBF    pred range    tail pred/true
#   lar_hgtd   layer        27.1+-1.0    28.0   25.2   [-498, 490]   0.95
#              none         28.0+-1.0    28.9   26.2   [-633, 686]   0.94
#              norm_last=F  27.8+-0.8    28.8   25.7   [-586, 573]   0.94
#   lar_only   layer        99.7+-0.6    87.8  128.5   [-427, 433]   0.62
#              none        101.0+-0.5    88.6  130.2   [-626, 646]   0.59
#              norm_last=F  98.9+-1.1    87.2  127.6   [-510, 529]   0.62
#   hgtd_only  layer        45.5+-1.0    52.6   32.9   [-492, 472]   0.85
#              none         48.3+-1.2    55.2   35.4   [-642, 615]   0.82
#              norm_last=F  51.2+-2.2    57.3   38.7   [-508, 467]   0.80
#
# Free for lar_hgtd and lar_only, 5.7 ps worse for hgtd_only, and no help to
# the clipped events anywhere. Not adopted; the head.norm_last switch was
# removed again (git log -S norm_last finds it).

trials: 3
seed: 51
epochs: 300
repeats: 3

space:
  head.norm_last: [false]
