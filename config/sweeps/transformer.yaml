# A transformer over the cell set, against the MLP-plus-pooling the presets
# have always used. Still the one untested architectural axis: this sweep was
# started once and cancelled at 9 of 16 when the sample-ordering bug turned
# up, and those trials ran on the broken pipeline, so nothing survives.
#
#   python scripts/sweep.py --space config/sweeps/transformer.yaml \
#       --config ../sweeps/transformer_base.yaml --out ../sweeps/v3_transformer
#
# Worth asking even though the architecture sweep found the model indifferent
# to how it aggregates cells -- attention pooling, masked average and the
# selection head landed within 0.7 ps of each other -- because a transformer
# is the one aggregator that lets cells see each other rather than only the
# event summary. Whether that matters is exactly what was never measured.
#
# Comparable to the cell-selection sweep beside it: same base, same repeats.

trials: 16
seed: 22
epochs: 300
repeats: 2

space:
  data.inputs.cells.encoder.d_model:    [64, 128]
  data.inputs.cells.encoder.num_blocks: [2, 3]
  data.inputs.cells.encoder.num_heads:  [4, 8]
