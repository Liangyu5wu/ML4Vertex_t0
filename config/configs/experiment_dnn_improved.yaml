# Improved DNN configuration with physics-informed features
model_name: "improved_dnn_with_jets"

# Model architecture
model_architecture: "two_stage_dnn"
loss_function: "mse"  # Changed from huber to mse

# Data parameters
data_dir: "../selected_h5_with_jets/"
num_files: 43
max_cells: 30
min_cells: 1
cell_selection_feature: "Cell_e"

# Feature selection
use_spatial_features: false
use_track_features: false
use_jet_features: true
use_physics_informed_features: true  # NEW: Enable physics features

# Cell filtering
require_valid_cells: true
use_cell_track_matching: false
use_cell_jet_matching: true

# Time quality cut
use_time_quality_cut: true
vertex_time_sigma: 175.0
time_quality_n_sigma: 3.0

# Detector calibration
use_detector_params: true
calibration_data_file: "cell_jet_calibration.txt"

# Model settings
use_attention_mask: true

# Data split
test_size: 0.1
val_split: 0.222222
random_state: 42

# Enhanced DNN architecture
cell_encoder_units: [128, 64]  # Increased capacity
cell_dropout_rate: 0.1         # Reduced dropout
cell_activation: "relu"

# Attention pooling (uses physics weights)
use_attention_pooling: true
attention_pooling_masked: true
attention_hidden_units: 64     # Increased

# Event-level processing
event_encoder_units: [256, 128, 64]  # Simplified
event_dropout_rates: [0.2, 0.1, 0.05]
use_batch_norm: true

# Improved training parameters
batch_size: 64         # Reduced for better gradients
epochs: 100            # Reduced from 200
learning_rate: 0.0001  # More conservative
lr_reduction_factor: 0.3
early_stopping_patience: 20
lr_patience: 8
min_lr: 0.00000001

# Feature definitions (same as before)
all_cell_features:
  - "Cell_x"
  - "Cell_y"
  - "Cell_z"
  - "Cell_eta"
  - "Cell_phi"
  - "Cell_Barrel"
  - "Cell_layer"
  - "Cell_time_TOF_corrected"
  - "Cell_e"
  - "Cell_significance"
jet_features:
  - "matched_jet_pt"
  - "matched_jet_eta"
  - "matched_jet_phi"
  - "matched_jet_width"
  - "matched_jet_deltaR"

# Include time in normalization
skip_normalization: ["Cell_Barrel", "Cell_layer"]