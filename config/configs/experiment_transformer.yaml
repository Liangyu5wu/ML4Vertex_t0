# Transformer configuration with comprehensive feature options
model_name: "transformer_with_jets"

# Model architecture specification
model_architecture: "transformer"  # Use transformer architecture

# Data parameters
data_dir: "../selected_h5_with_jets/"
num_files: 43
max_cells: 70
min_cells: 1
cell_selection_feature: "Cell_e"

# Feature selection parameters (comprehensive switches)
use_spatial_features: false         # Spatial position features
use_track_features: false           # Track matching features  
use_jet_features: true              # Jet matching features
use_physics_informed_features: true # Physics-based 1/sigma^2 weighting

# Cell filtering parameters
require_valid_cells: true
use_cell_track_matching: false      # Track-based cell filtering
use_cell_jet_matching: true         # Jet-based cell filtering
additional_cell_filters: {}

# Time quality cut parameters
use_time_quality_cut: true          # Enable time quality filtering
vertex_time_sigma: 175.0            # HS vertex time uncertainty [ps]  
time_quality_n_sigma: 3.0           # N-sigma cut threshold

# Detector calibration parameters
use_detector_params: true
calibration_data_file: "cell_jet_calibration.txt"

# Calibration validation parameters
calibration_validation: true
validation_detector_type: 1         # 1=barrel, 0=endcap
validation_layer: 1                 # 1, 2, or 3
gaussian_fit_range: 120

# Model architecture parameters
use_attention_mask: true
max_position: 100                   # Maximum sequence length for positional encoding

# Data split parameters
test_size: 0.1                      # Test set fraction
val_split: 0.222222                 # Validation fraction of remaining data
random_state: 42

# Transformer architecture parameters
d_model: 64                         # Model dimension (must be divisible by num_heads)
num_heads: 8                        # Number of attention heads
dff: 128                            # Feed-forward network dimension
num_transformer_blocks: 2           # Number of transformer layers
dropout_rate: 0.1                   # Dropout rate

# Dense layer parameters
vertex_dense_units: 8
final_dense_units: [32, 16, 8]
final_dropout_rates: [0.1, 0.1, 0.05]
use_batch_norm: true

# Training parameters
batch_size: 128
epochs: 200                         # Default training epochs
learning_rate: 0.001                # Default learning rate
lr_reduction_factor: 0.5
early_stopping_patience: 20
lr_patience: 5
min_lr: 0.0000001

# Loss function parameters
loss_function: "huber"              # Options: "mse" or "huber"
huber_delta: 100.0                  # Huber loss parameter

# Feature definitions
spatial_features: ["Cell_x", "Cell_y", "Cell_z"]
vertex_spatial_features: ["HSvertex_reco_x", "HSvertex_reco_y", "HSvertex_reco_z"]
all_cell_features:
  - "Cell_x"
  - "Cell_y" 
  - "Cell_z"
  - "Cell_eta"
  - "Cell_phi"
  - "Cell_Barrel"
  - "Cell_layer"
  - "Cell_time_TOF_corrected"
  - "Cell_e"
  - "Cell_significance"
track_features:
  - "matched_track_pt"
  - "matched_track_deltaR"
jet_features:
  - "matched_jet_pt"
  - "matched_jet_eta"
  - "matched_jet_phi"
  - "matched_jet_width"
  - "matched_jet_deltaR"
skip_normalization: ["Cell_Barrel", "Cell_layer"]  # Allow time normalization