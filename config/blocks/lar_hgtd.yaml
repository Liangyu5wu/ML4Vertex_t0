model_name: lar_hgtd
model_dir: /pscratch/sd/l/liangyu/vertextiming/models/lar_hgtd
data:
  datasets:
  - name: ttbar
    path: /global/cfs/cdirs/m2616/liangyu/vertextiming/store/ttbar
  - name: vbf_hinv
    path: /global/cfs/cdirs/m2616/liangyu/vertextiming/store/vbf_hinv
  resample: oversample
  target: truth_vtx_time
  event_features:
  - reco_vtx_x
  - reco_vtx_y
  - reco_vtx_z
  # Truth: keep only events whose sum-pt^2 vertex is within 3 mm of the true
  # hard scatter, standing in for a better vertex identification.
  event_select:
  - field: hs_vtx_dz
    abs_max: 3.0
  split:
    test_size: 0.2
    val_split: 0.125
    random_state: 42
  inputs:
    cells:
      preset: lar_cells
      max_items: 120
      min_items: 1
      encoder:
        units:
        - 256
        - 128
        - 64
        dropout: 0.0
        pooling: attention
        attention_units: 32
      transform:
        time:
          asinh: 100.0
    jets_emtopo:
      preset: jets_emtopo
      max_items: 15
      encoder:
        units:
        - 64
        - 32
        dropout: 0.0
        norm: layer
        pooling: masked_average
    tracks:
      preset: hs_tracks
      max_items: 50
      encoder:
        units:
        - 64
        - 32
        dropout: 0.0
        norm: layer
        pooling: masked_average
    hgtd_tracks:
      preset: hgtd_tracks
      max_items: 55
      min_items: 1
      encoder:
        units:
        - 64
        - 32
        dropout: 0.0
        norm: layer
        pooling: masked_average
    vertices:
      preset: vertices
      max_items: 10
      encoder:
        units:
        - 32
        - 16
        dropout: 0.0
        norm: layer
        pooling: masked_average
head:
  units:
  - 256
  - 128
  - 64
  - 32
  dropout: 0.0
  norm: layer
loss:
  type: gaussian_nll
  beta: 0.25
  sigma_init: 100.0
optimizer:
  type: adam
  learning_rate: 0.005
training:
  epochs: 300
  batch_size: 1024
  early_stopping_patience: 25
  lr_reduction_factor: 0.5
  lr_patience: 8
  min_lr: 1.0e-07
  warmup_epochs: 5
evaluation:
  fit:
    method: double_gaussian
    pileup_sigma: 175.74
    fix_pileup_sigma: true
  # Working points on the predicted sigma, fixed in ps -- the form a cut in
  # data takes -- and the same in every config, so each reads as an expected
  # resolution. On validation here: 46 / 71 / 81% kept, q68 of the kept 13.9 / 17.4 / 19.6 ps.
  sigma_cut:
  - {name: tight, max_sigma: 20.0}
  - {name: medium, max_sigma: 40.0}
  - {name: loose, max_sigma: 60.0}
