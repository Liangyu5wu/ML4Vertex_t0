model_name: lar_hgtd
model_dir: /pscratch/sd/l/liangyu/vertextiming/models/lar_hgtd
data:
  datasets:
  - name: ttbar
    path: /global/cfs/cdirs/m2616/liangyu/vertextiming/store/ttbar
  - name: vbf_hinv
    path: /global/cfs/cdirs/m2616/liangyu/vertextiming/store/vbf_hinv
  resample: oversample
  target: truth_vtx_time
  event_features:
  - reco_vtx_x
  - reco_vtx_y
  - reco_vtx_z
  split:
    test_size: 0.2
    val_split: 0.125
    random_state: 42
  inputs:
    cells:
      preset: lar_cells
      max_items: 120
      min_items: 1
      encoder:
        units:
        - 256
        - 128
        - 64
        dropout: 0.0
        pooling: attention
        attention_units: 32
    jets_emtopo:
      preset: jets_emtopo
      max_items: 15
      encoder:
        units:
        - 64
        - 32
        dropout: 0.0
        norm: layer
        pooling: masked_average
    tracks:
      preset: hs_tracks
      max_items: 50
      encoder:
        units:
        - 64
        - 32
        dropout: 0.0
        norm: layer
        pooling: masked_average
    hgtd_tracks:
      preset: hgtd_tracks
      max_items: 55
      min_items: 1
      encoder:
        units:
        - 64
        - 32
        dropout: 0.0
        norm: layer
        pooling: masked_average
    vertices:
      preset: vertices
      max_items: 10
      encoder:
        units:
        - 32
        - 16
        dropout: 0.0
        norm: layer
        pooling: masked_average
head:
  units:
  - 256
  - 128
  - 64
  - 32
  dropout: 0.0
  norm: layer
loss:
  type: gaussian_nll
  beta: 0.25
  sigma_init: 100.0
optimizer:
  type: adam
  learning_rate: 0.005
training:
  epochs: 300
  batch_size: 1024
  early_stopping_patience: 25
  lr_reduction_factor: 0.5
  lr_patience: 8
  min_lr: 1.0e-07
  warmup_epochs: 5
evaluation:
  fit:
    method: double_gaussian
    pileup_sigma: 175.74
    fix_pileup_sigma: true
