# HGTD only: timing-detector tracks, no calorimeter input.
# The three configs in config/blocks/ differ only in 'inputs:'.
#
#   python scripts/train_blocks.py --config config/blocks/hgtd_only.yaml
#   ... --datasets ttbar        # or vbf_hinv; omit for the mixture

model_name: hgtd_only
model_dir: /pscratch/sd/l/liangyu/vertextiming/models/hgtd_only

data:
  datasets:
    - {name: ttbar,    path: /global/cfs/cdirs/m2616/liangyu/vertextiming/store/ttbar}
    - {name: vbf_hinv, path: /global/cfs/cdirs/m2616/liangyu/vertextiming/store/vbf_hinv}
  balance: true            # equalise each sample's contribution to the loss
  sample_onehot: false     # tell the network which sample an event came from
  target: truth_vtx_time
  event_features: [reco_vtx_x, reco_vtx_y, reco_vtx_z]
  split: {test_size: 0.2, val_split: 0.222222, random_state: 42}

  inputs:
    hgtd_tracks:
      preset: hgtd_tracks
      max_items: 30
      min_items: 1
      encoder: {units: [64, 32], dropout: [0.1, 0.1], batch_norm: true, pooling: masked_average}

head:
  units: [128, 64, 32, 16]
  dropout: [0.2, 0.1, 0.1, 0.1]
  batch_norm: false

loss: {type: huber, delta: 100.0}
optimizer: {type: adam, learning_rate: 0.001}

training:
  epochs: 200
  batch_size: 256
  early_stopping_patience: 20
  lr_reduction_factor: 0.5
  lr_patience: 8
  min_lr: 1.0e-7

evaluation:
  fit: {method: double_gaussian, pileup_sigma: 175.74, fix_pileup_sigma: true}
