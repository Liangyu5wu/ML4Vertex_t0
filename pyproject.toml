[project]
name = "ml4vertex-t0"
version = "0.2.0"
description = "Vertex time (t0) reconstruction from LAr calorimeter and HGTD timing"
requires-python = ">=3.11,<3.13"

# CPU-only by default so a laptop install stays small; the CUDA wheels come
# from `uv sync --extra cuda`, which is what setup.sh does when it sees a GPU.
dependencies = [
    "tensorflow==2.20.*",
    "numpy>=2.0",
    "h5py>=3.11",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "pyyaml>=6.0",
    "matplotlib>=3.9",
    "seaborn>=0.13",
    "pandas>=2.2",
]

[project.optional-dependencies]
cuda = ["tensorflow[and-cuda]==2.20.*"]
notebook = ["jupyterlab>=4.2", "ipykernel>=6.29"]

[tool.uv]
# Scripts run from the repo root and import `src.*` directly; there is no
# package to build or install.
package = false
